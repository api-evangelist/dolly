name: Dolly
description: Dolly was a Seattle-based on-demand moving and last-mile delivery marketplace that connected
  people who needed help moving furniture and large items with independent "Helpers" who owned pickup trucks
  and vans, coordinated through consumer and retail-partner mobile apps. It grew a same-day big-and-bulky
  delivery network used by retailers such as IKEA, Costco, Lowe's, West Elm, and Peloton. Dolly was acquired
  and folded into TaskRabbit (owned by IKEA / Ingka Group); as of 2026 the dolly.com domain 301-redirects
  entirely to taskrabbit.com/delivery, and the service now operates under the "Taskrabbit Delivery" brand.
  No standalone Dolly-owned developer portal, public API, or well-known discovery surface survives — every
  dolly.com path redirects into TaskRabbit. This profile records the honest disposition of the company; the
  developer/API footprint now lives (if anywhere) under TaskRabbit, not Dolly.
